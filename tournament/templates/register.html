{% extends "base.html" %}

{% block content %}
<div class="card login-card">
    <h2>Create an Account</h2>
    <form action="{{ url_for('register') }}" method="POST" class="form">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required autocomplete="username">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required autocomplete="new-password">
        </div>
        <div class="form-group">
            <label for="role">Role</label>
            <select id="role" name="role" required>
                <option value="owner" selected>Team Owner</option>
                <option value="admin">Administrator</option>
            </select>
        </div>
        <button type="submit" class="button">Register Account</button>
    </form>
    <p class="form-help">Already registered? <a href="{{ url_for('login') }}">Login here</a>.</p>
</div>
{% endblock %}
